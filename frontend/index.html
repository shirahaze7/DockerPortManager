<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Docker Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <div class="logo">

    <div class="logo-icon"></div>

    <div>
      <h1>Docker Dashboard</h1>
      <p>COMPOSE SERVICE MONITOR</p>
    </div>

  </div>

  <div class="header-right">

    <div class="stat-badge">
      HOST <span id="hdr-host">—</span>
    </div>

    <button
      class="btn-refresh"
      id="btn-refresh"
      onclick="loadData()"
    >
      ↻ REFRESH
    </button>

  </div>
</header>

<main>

  <div class="stats-row">

    <div class="stat-card total">
      <div class="label">Total Services</div>
      <div class="value" id="stat-total">—</div>
    </div>

    <div class="stat-card active">
      <div class="label">Port In-Use</div>
      <div class="value" id="stat-active">—</div>
    </div>

    <div class="stat-card idle">
      <div class="label">Idle</div>
      <div class="value" id="stat-idle">—</div>
    </div>

    <div class="stat-card files">
      <div class="label">Compose Files</div>
      <div class="value" id="stat-files">—</div>
    </div>

  </div>

  <div class="section-header">
    <h2>Service List</h2>
  </div>

  <div id="table-wrap">

    <div class="empty-state">
      <div class="icon">⟳</div>
      <p>LOADING...</p>
    </div>

  </div>

  <div id="errors-section"></div>

  <div id="timestamp"></div>

</main>

<script>
  const API = '/api/services';

  async function loadData() {

    const btn = document.getElementById('btn-refresh');

    btn.classList.add('loading');

    btn.textContent = '↻ LOADING...';

    try {

      const res = await fetch(API);

      const data = await res.json();

      render(data);

    } catch (e) {

      document.getElementById('table-wrap').innerHTML = `
        <div class="empty-state">
          <div class="icon">✕</div>
          <p>API CONNECTION ERROR</p>
        </div>
      `;

    } finally {

      btn.classList.remove('loading');

      btn.textContent = '↻ REFRESH';
    }
  }

  function render(data) {

    const services = data.services || [];

    const active =
      services.filter(s => s.in_use).length;

    const idle =
      services.length - active;

    document.getElementById('stat-total').textContent =
      services.length;

    document.getElementById('stat-active').textContent =
      active;

    document.getElementById('stat-idle').textContent =
      idle;

    document.getElementById('stat-files').textContent =
      data.compose_files_found || 0;

    document.getElementById('hdr-host').textContent =
      location.hostname;

    const wrap =
      document.getElementById('table-wrap');

    if (services.length === 0) {

      wrap.innerHTML = `
        <div class="empty-state">
          <div class="icon">◎</div>
          <p>NO COMPOSE FILES FOUND</p>
        </div>
      `;

      return;
    }

    services.sort((a, b) =>
      (b.in_use - a.in_use)
      ||
      ((a.host_port || 0) - (b.host_port || 0))
    );

    const cards = services.map((s, i) => {

      return `
        <div
          class="service-card ${s.in_use ? 'in-use' : ''} animate-in"
          style="animation-delay:${i * 30}ms"
        >

          <div class="card-top">

            <div>

              <div class="service-title">
                ${esc(s.service)}
              </div>

              <div class="service-sub">
                ${esc(s.compose_file)}
              </div>

            </div>

            <div class="status-badge ${s.in_use ? 'active' : 'idle'}">

              ${s.in_use ? 'ACTIVE' : 'IDLE'}

            </div>

          </div>

          <div class="port-box">

            <div class="port-label">
              HOST PORT
            </div>

            <div class="port-number">
              ${s.host_port || '—'}
            </div>

          </div>

          ${
            s.url
              ? `
                <a
                  class="open-btn ${s.in_use ? '' : 'disabled'}"
                  href="${s.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  OPEN SERVICE
                </a>
              `
              : `
                <div class="open-btn disabled">
                  NO URL
                </div>
              `
          }

        </div>
      `;

    }).join('');

    wrap.innerHTML = `
      <div class="service-grid">
        ${cards}
      </div>
    `;

    const errSec =
      document.getElementById('errors-section');

    if (data.errors && data.errors.length > 0) {

      errSec.innerHTML = `
        <div
          class="section-header"
          style="margin-top:28px"
        >
          <h2>Parse Errors</h2>
        </div>

        <div class="error-list">

          ${data.errors.map(e => `
            <div class="error-item">

              <div class="err-file">
                ${esc(e.file)}
              </div>

              <div>
                ${esc(e.error)}
              </div>

            </div>
          `).join('')}

        </div>
      `;

    } else {

      errSec.innerHTML = '';
    }

    document.getElementById('timestamp').textContent =
      'LAST UPDATED: '
      +
      new Date().toLocaleString('ja-JP');
  }

  function esc(s) {

    return String(s || '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c])
    );
  }

  loadData();

  setInterval(loadData, 30000);
</script>

</body>
</html>
