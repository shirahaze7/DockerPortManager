<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Docker Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f7f9fb;
      --surface: rgba(255, 255, 255, 0.98);
      --surface-soft: rgba(249, 250, 252, 0.92);
      --border: rgba(148, 163, 184, 0.16);
      --accent: #7c5cff;
      --accent2: #40a9ff;
      --green: #22c55e;
      --yellow: #f59e0b;
      --text: #0f172a;
      --text2: #475569;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: var(--sans);
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fb 55%, #ffffff 100%);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(124, 92, 255, 0.16), transparent 18%),
        radial-gradient(circle at 95% 15%, rgba(64, 169, 255, 0.14), transparent 20%),
        radial-gradient(circle at 85% 90%, rgba(124, 92, 255, 0.08), transparent 22%);
      pointer-events: none;
      z-index: 0;
    }

    /* ───────── HEADER ───────── */

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 32px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(124, 92, 255, 0.2);
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.18), rgba(64, 169, 255, 0.16));
      box-shadow: 0 20px 50px rgba(124, 92, 255, 0.15);
    }

    .logo-icon::before {
      content: '⬢';
      color: var(--accent);
      font-size: 22px;
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .logo p {
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-badge {
      padding: 12px 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.18);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
      letter-spacing: 0.08em;
    }

    .stat-badge span {
      color: var(--text);
      font-weight: 700;
    }

    .btn-refresh {
      border: none;
      padding: 14px 22px;
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 20px 38px rgba(124, 92, 255, 0.2);
      transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-refresh:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 46px rgba(124, 92, 255, 0.24);
    }

    .btn-refresh.loading {
      opacity: 0.72;
      pointer-events: none;
    }

    /* ───────── MAIN ───────── */

    main {
      position: relative;
      z-index: 1;
      max-width: 1440px;
      margin: 0 auto;
      padding: 34px 32px 40px;
    }

    .stats-row,
    .service-grid {
      display: grid;
      gap: 20px;
    }

    .stats-row {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-bottom: 36px;
    }

    .stat-card,
    .service-card,
    .port-box,
    .empty-state,
    .error-item {
      border-radius: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.06);
    }

    .stat-card {
      padding: 28px 26px;
    }

    .stat-card .label {
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stat-card .value {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .stat-card.active .value {
      color: var(--green);
    }

    .stat-card.idle .value {
      color: #64748b;
    }

    .stat-card.files .value {
      color: var(--yellow);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .section-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(71, 85, 105, 0.12);
    }

    .service-grid {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .service-card {
      position: relative;
      padding: 26px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .service-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 32px 72px rgba(15, 23, 42, 0.12);
    }

    .service-card.in-use {
      border-color: rgba(34, 197, 94, 0.18);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .service-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      word-break: break-word;
    }

    .service-sub {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text2);
      word-break: break-all;
    }

    .status-badge {
      flex-shrink: 0;
      padding: 9px 14px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .status-badge.active {
      color: #0f5132;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.18);
    }

    .status-badge.idle {
      color: #475569;
      background: rgba(71, 85, 105, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .port-box {
      padding: 20px;
      margin-top: 10px;
      border-radius: 22px;
      background: rgba(247, 249, 251, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .port-label {
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .port-number {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 700;
      color: var(--accent2);
    }

    .open-btn {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      text-decoration: none;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 1px solid rgba(124, 92, 255, 0.18);
      box-shadow: 0 18px 36px rgba(124, 92, 255, 0.14);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .open-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 42px rgba(124, 92, 255, 0.18);
    }

    .open-btn.disabled {
      opacity: 0.6;
      pointer-events: none;
      background: rgba(226, 232, 240, 0.95);
      color: #475569;
      border-color: rgba(148, 163, 184, 0.12);
      box-shadow: none;
    }

    .empty-state {
      padding: 80px 24px;
      text-align: center;
      color: var(--text2);
      border-radius: 28px;
    }

    .empty-state .icon {
      font-size: 44px;
      margin-bottom: 14px;
      opacity: 0.75;
      color: var(--accent2);
    }

    .empty-state p {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .error-list {
      margin-top: 24px;
    }

    .error-item {
      margin-bottom: 10px;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: #b91c1c;
      background: rgba(254, 226, 226, 0.9);
      border: 1px solid rgba(239, 68, 68, 0.18);
    }

    .err-file {
      margin-bottom: 5px;
      color: #7f1d1d;
    }

    #timestamp {
      margin-top: 30px;
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
      opacity: 0.9;
      letter-spacing: 0.08em;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeIn 0.28s ease forwards;
    }

    @media (max-width: 1024px) {
      header {
        padding: 22px 24px;
      }
      main {
        padding: 28px 24px 32px;
      }
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: stretch;
        padding: 22px 20px;
      }
      .header-right {
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .stat-badge {
        flex: 1 1 100%;
      }
      .service-grid,
      .stats-row {
        grid-template-columns: 1fr;
      }
      .service-card {
        padding: 22px;
      }
      .port-number {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">

    <div class="logo-icon"></div>

    <div>
      <h1>Docker Dashboard</h1>
      <p>COMPOSE SERVICE MONITOR</p>
    </div>

  </div>

  <div class="header-right">

    <div class="stat-badge">
      HOST <span id="hdr-host">—</span>
    </div>

    <button
      class="btn-refresh"
      id="btn-refresh"
      onclick="loadData()"
    >
      ↻ REFRESH
    </button>

  </div>
</header>

<main>

  <div class="stats-row">

    <div class="stat-card total">
      <div class="label">Total Services</div>
      <div class="value" id="stat-total">—</div>
    </div>

    <div class="stat-card active">
      <div class="label">Port In-Use</div>
      <div class="value" id="stat-active">—</div>
    </div>

    <div class="stat-card idle">
      <div class="label">Idle</div>
      <div class="value" id="stat-idle">—</div>
    </div>

    <div class="stat-card files">
      <div class="label">Compose Files</div>
      <div class="value" id="stat-files">—</div>
    </div>

  </div>

  <div class="section-header">
    <h2>Service List</h2>
  </div>

  <div id="table-wrap">

    <div class="empty-state">
      <div class="icon">⟳</div>
      <p>LOADING...</p>
    </div>

  </div>

  <div id="errors-section"></div>

  <div id="timestamp"></div>

</main>

<script>
  const API = '/api/services';

  async function loadData() {

    const btn = document.getElementById('btn-refresh');

    btn.classList.add('loading');

    btn.textContent = '↻ LOADING...';

    try {

      const res = await fetch(API);

      const data = await res.json();

      render(data);

    } catch (e) {

      document.getElementById('table-wrap').innerHTML = `
        <div class="empty-state">
          <div class="icon">✕</div>
          <p>API CONNECTION ERROR</p>
        </div>
      `;

    } finally {

      btn.classList.remove('loading');

      btn.textContent = '↻ REFRESH';
    }
  }

  function render(data) {

    const services = data.services || [];

    const active =
      services.filter(s => s.in_use).length;

    const idle =
      services.length - active;

    document.getElementById('stat-total').textContent =
      services.length;

    document.getElementById('stat-active').textContent =
      active;

    document.getElementById('stat-idle').textContent =
      idle;

    document.getElementById('stat-files').textContent =
      data.compose_files_found || 0;

    document.getElementById('hdr-host').textContent =
      location.hostname;

    const wrap =
      document.getElementById('table-wrap');

    if (services.length === 0) {

      wrap.innerHTML = `
        <div class="empty-state">
          <div class="icon">◎</div>
          <p>NO COMPOSE FILES FOUND</p>
        </div>
      `;

      return;
    }

    services.sort((a, b) =>
      (b.in_use - a.in_use)
      ||
      ((a.host_port || 0) - (b.host_port || 0))
    );

    const cards = services.map((s, i) => {

      return `
        <div
          class="service-card ${s.in_use ? 'in-use' : ''} animate-in"
          style="animation-delay:${i * 30}ms"
        >

          <div class="card-top">

            <div>

              <div class="service-title">
                ${esc(s.service)}
              </div>

              <div class="service-sub">
                ${esc(s.compose_file)}
              </div>

            </div>

            <div class="status-badge ${s.in_use ? 'active' : 'idle'}">

              ${s.in_use ? 'ACTIVE' : 'IDLE'}

            </div>

          </div>

          <div class="port-box">

            <div class="port-label">
              HOST PORT
            </div>

            <div class="port-number">
              ${s.host_port || '—'}
            </div>

          </div>

          ${
            s.url
              ? `
                <a
                  class="open-btn ${s.in_use ? '' : 'disabled'}"
                  href="${s.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  OPEN SERVICE
                </a>
              `
              : `
                <div class="open-btn disabled">
                  NO URL
                </div>
              `
          }

        </div>
      `;

    }).join('');

    wrap.innerHTML = `
      <div class="service-grid">
        ${cards}
      </div>
    `;

    const errSec =
      document.getElementById('errors-section');

    if (data.errors && data.errors.length > 0) {

      errSec.innerHTML = `
        <div
          class="section-header"
          style="margin-top:28px"
        >
          <h2>Parse Errors</h2>
        </div>

        <div class="error-list">

          ${data.errors.map(e => `
            <div class="error-item">

              <div class="err-file">
                ${esc(e.file)}
              </div>

              <div>
                ${esc(e.error)}
              </div>

            </div>
          `).join('')}

        </div>
      `;

    } else {

      errSec.innerHTML = '';
    }

    document.getElementById('timestamp').textContent =
      'LAST UPDATED: '
      +
      new Date().toLocaleString('ja-JP');
  }

  function esc(s) {

    return String(s || '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c])
    );
  }

  loadData();

  setInterval(loadData, 30000);
</script>

</body>
</html>
