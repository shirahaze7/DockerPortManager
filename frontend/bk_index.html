<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Docker Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #131722;

      --surface: rgba(24, 30, 45, 0.78);

      --border: rgba(255,255,255,0.05);
      --border2: rgba(255,255,255,0.08);

      --accent: #00e5ff;
      --accent2: #7c5cff;

      --green: #39ff89;
      --yellow: #ffd166;

      --text: #d8e1f0;
      --text2: #8ea0ba;

      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans JP', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      color: var(--text);

      font-family: var(--sans);

      background:
        radial-gradient(circle at top left,
          rgba(0,229,255,0.08),
          transparent 30%
        ),

        radial-gradient(circle at bottom right,
          rgba(124,92,255,0.08),
          transparent 30%
        ),

        var(--bg);

      overflow-x: hidden;
    }

    body::before {
      content: '';

      position: fixed;
      inset: 0;

      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255,255,255,0.015) 2px,
          rgba(255,255,255,0.015) 4px
        );

      pointer-events: none;
      z-index: 999;
    }

    /* ───────── HEADER ───────── */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 20px 32px;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      background: rgba(17, 22, 32, 0.75);

      border-bottom: 1px solid var(--border2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(0,229,255,0.25);

      background:
        linear-gradient(
          135deg,
          rgba(0,229,255,0.15),
          rgba(0,229,255,0.03)
        );

      box-shadow:
        0 0 20px rgba(0,229,255,0.08);
    }

    .logo-icon::before {
      content: '⬢';

      color: var(--accent);

      font-size: 18px;
    }

    .logo h1 {
      font-size: 18px;
      font-weight: 600;

      letter-spacing: 0.06em;

      color: white;
    }

    .logo p {
      margin-top: 2px;

      font-family: var(--mono);
      font-size: 11px;

      color: var(--text2);

      letter-spacing: 0.12em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-badge {
      padding: 8px 14px;

      border-radius: 12px;

      background: rgba(255,255,255,0.04);

      border: 1px solid rgba(255,255,255,0.05);

      font-family: var(--mono);
      font-size: 11px;

      color: var(--text2);

      letter-spacing: 0.08em;
    }

    .stat-badge span {
      color: white;
      font-weight: 600;
    }

    .btn-refresh {
      border: none;

      padding: 10px 18px;

      border-radius: 12px;

      cursor: pointer;

      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.08em;

      color: var(--accent);

      background:
        linear-gradient(
          135deg,
          rgba(0,229,255,0.16),
          rgba(0,229,255,0.06)
        );

      border: 1px solid rgba(0,229,255,0.18);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .btn-refresh:hover {
      transform: translateY(-2px);
    }

    .btn-refresh.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    /* ───────── MAIN ───────── */

    main {
      max-width: 1440px;

      margin: 0 auto;

      padding: 30px;
    }

    /* ───────── STATS ───────── */

    .stats-row {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 18px;

      margin-bottom: 32px;
    }

    .stat-card {
      padding: 24px;

      border-radius: 22px;

      background: var(--surface);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,0.05);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.22);
    }

    .stat-card .label {
      margin-bottom: 10px;

      font-family: var(--mono);
      font-size: 11px;

      color: var(--text2);

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }

    .stat-card .value {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-card.total .value {
      color: white;
    }

    .stat-card.active .value {
      color: var(--green);
    }

    .stat-card.idle .value {
      color: #8a97ab;
    }

    .stat-card.files .value {
      color: var(--yellow);
    }

    /* ───────── SECTION ───────── */

    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;

      margin-bottom: 20px;
    }

    .section-header h2 {
      font-family: var(--mono);

      font-size: 11px;

      color: var(--text2);

      letter-spacing: 0.2em;

      text-transform: uppercase;
    }

    .section-header::after {
      content: '';

      flex: 1;

      height: 1px;

      background: rgba(255,255,255,0.08);
    }

    /* ───────── GRID ───────── */

    .service-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(320px, 1fr));

      gap: 20px;
    }

    /* ───────── CARD ───────── */

    .service-card {
      position: relative;

      padding: 22px;

      border-radius: 24px;

      background: var(--surface);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(255,255,255,0.05);

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .service-card:hover {
      transform: translateY(-4px);

      border-color: rgba(0,229,255,0.22);

      box-shadow:
        0 16px 40px rgba(0,0,0,0.35),
        0 0 24px rgba(0,229,255,0.08);
    }

    .service-card.in-use {
      border-color: rgba(57,255,137,0.16);

      box-shadow:
        0 0 0 1px rgba(57,255,137,0.03),
        0 0 24px rgba(57,255,137,0.05);
    }

    /* ───────── CARD TOP ───────── */

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 14px;

      margin-bottom: 18px;
    }

    .service-title {
      font-size: 18px;
      font-weight: 600;

      color: white;

      margin-bottom: 6px;

      word-break: break-word;
    }

    .service-sub {
      font-family: var(--mono);

      font-size: 11px;

      line-height: 1.6;

      color: var(--text2);

      word-break: break-all;
    }

    /* ───────── STATUS ───────── */

    .status-badge {
      flex-shrink: 0;

      padding: 7px 11px;

      border-radius: 999px;

      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.08em;
    }

    .status-badge.active {
      color: var(--green);

      background: rgba(57,255,137,0.12);

      border: 1px solid rgba(57,255,137,0.24);
    }

    .status-badge.idle {
      color: var(--text2);

      background: rgba(255,255,255,0.03);

      border: 1px solid rgba(255,255,255,0.05);
    }

    /* ───────── PORT BOX ───────── */

    .port-box {
      padding: 16px;

      border-radius: 16px;

      background: rgba(255,255,255,0.03);

      border: 1px solid rgba(255,255,255,0.05);
    }

    .port-label {
      margin-bottom: 8px;

      font-size: 11px;

      color: var(--text2);

      letter-spacing: 0.1em;
    }

    .port-number {
      font-family: var(--mono);

      font-size: 30px;
      font-weight: 700;

      color: var(--accent);
    }

    /* ───────── BUTTON ───────── */

    .open-btn {
      margin-top: 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 13px 16px;

      border-radius: 14px;

      text-decoration: none;

      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;

      letter-spacing: 0.08em;

      color: var(--accent);

      background:
        linear-gradient(
          135deg,
          rgba(0,229,255,0.16),
          rgba(0,229,255,0.05)
        );

      border: 1px solid rgba(0,229,255,0.16);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .open-btn:hover {
      transform: translateY(-1px);

      background:
        linear-gradient(
          135deg,
          rgba(0,229,255,0.24),
          rgba(0,229,255,0.08)
        );
    }

    .open-btn.disabled {
      opacity: 0.4;

      pointer-events: none;
    }

    /* ───────── EMPTY ───────── */

    .empty-state {
      padding: 80px 20px;

      text-align: center;

      color: var(--text2);
    }

    .empty-state .icon {
      font-size: 42px;

      margin-bottom: 14px;

      opacity: 0.5;
    }

    .empty-state p {
      font-family: var(--mono);

      font-size: 12px;

      letter-spacing: 0.12em;
    }

    /* ───────── ERRORS ───────── */

    .error-list {
      margin-top: 24px;
    }

    .error-item {
      margin-bottom: 10px;

      padding: 14px 16px;

      border-radius: 14px;

      background: rgba(255,77,109,0.06);

      border: 1px solid rgba(255,77,109,0.18);

      font-family: var(--mono);
      font-size: 11px;

      color: #ff8aa1;
    }

    .err-file {
      margin-bottom: 5px;

      color: var(--text2);
    }

    /* ───────── FOOTER ───────── */

    #timestamp {
      margin-top: 28px;

      text-align: right;

      font-family: var(--mono);
      font-size: 11px;

      color: var(--text2);

      opacity: 0.7;

      letter-spacing: 0.08em;
    }

    /* ───────── ANIMATIONS ───────── */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeIn 0.28s ease forwards;
    }

    /* ───────── MOBILE ───────── */

    @media (max-width: 768px) {

      header {
        padding: 18px;
      }

      main {
        padding: 18px;
      }

      .header-right {
        gap: 10px;
      }

      .stat-badge {
        display: none;
      }

      .service-grid {
        grid-template-columns: 1fr;
      }

      .stats-row {
        grid-template-columns: 1fr 1fr;
      }

      .service-card {
        padding: 18px;
      }

      .port-number {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">

    <div class="logo-icon"></div>

    <div>
      <h1>Docker Dashboard</h1>
      <p>COMPOSE SERVICE MONITOR</p>
    </div>

  </div>

  <div class="header-right">

    <div class="stat-badge">
      HOST <span id="hdr-host">—</span>
    </div>

    <button
      class="btn-refresh"
      id="btn-refresh"
      onclick="loadData()"
    >
      ↻ REFRESH
    </button>

  </div>
</header>

<main>

  <div class="stats-row">

    <div class="stat-card total">
      <div class="label">Total Services</div>
      <div class="value" id="stat-total">—</div>
    </div>

    <div class="stat-card active">
      <div class="label">Port In-Use</div>
      <div class="value" id="stat-active">—</div>
    </div>

    <div class="stat-card idle">
      <div class="label">Idle</div>
      <div class="value" id="stat-idle">—</div>
    </div>

    <div class="stat-card files">
      <div class="label">Compose Files</div>
      <div class="value" id="stat-files">—</div>
    </div>

  </div>

  <div class="section-header">
    <h2>Service List</h2>
  </div>

  <div id="table-wrap">

    <div class="empty-state">
      <div class="icon">⟳</div>
      <p>LOADING...</p>
    </div>

  </div>

  <div id="errors-section"></div>

  <div id="timestamp"></div>

</main>

<script>
  const API = '/api/services';

  async function loadData() {

    const btn = document.getElementById('btn-refresh');

    btn.classList.add('loading');

    btn.textContent = '↻ LOADING...';

    try {

      const res = await fetch(API);

      const data = await res.json();

      render(data);

    } catch (e) {

      document.getElementById('table-wrap').innerHTML = `
        <div class="empty-state">
          <div class="icon">✕</div>
          <p>API CONNECTION ERROR</p>
        </div>
      `;

    } finally {

      btn.classList.remove('loading');

      btn.textContent = '↻ REFRESH';
    }
  }

  function render(data) {

    const services = data.services || [];

    const active =
      services.filter(s => s.in_use).length;

    const idle =
      services.length - active;

    document.getElementById('stat-total').textContent =
      services.length;

    document.getElementById('stat-active').textContent =
      active;

    document.getElementById('stat-idle').textContent =
      idle;

    document.getElementById('stat-files').textContent =
      data.compose_files_found || 0;

    document.getElementById('hdr-host').textContent =
      location.hostname;

    const wrap =
      document.getElementById('table-wrap');

    if (services.length === 0) {

      wrap.innerHTML = `
        <div class="empty-state">
          <div class="icon">◎</div>
          <p>NO COMPOSE FILES FOUND</p>
        </div>
      `;

      return;
    }

    services.sort((a, b) =>
      (b.in_use - a.in_use)
      ||
      ((a.host_port || 0) - (b.host_port || 0))
    );

    const cards = services.map((s, i) => {

      return `
        <div
          class="service-card ${s.in_use ? 'in-use' : ''} animate-in"
          style="animation-delay:${i * 30}ms"
        >

          <div class="card-top">

            <div>

              <div class="service-title">
                ${esc(s.service)}
              </div>

              <div class="service-sub">
                ${esc(s.compose_file)}
              </div>

            </div>

            <div class="status-badge ${s.in_use ? 'active' : 'idle'}">

              ${s.in_use ? 'ACTIVE' : 'IDLE'}

            </div>

          </div>

          <div class="port-box">

            <div class="port-label">
              HOST PORT
            </div>

            <div class="port-number">
              ${s.host_port || '—'}
            </div>

          </div>

          ${
            s.url
              ? `
                <a
                  class="open-btn ${s.in_use ? '' : 'disabled'}"
                  href="${s.url}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  OPEN SERVICE
                </a>
              `
              : `
                <div class="open-btn disabled">
                  NO URL
                </div>
              `
          }

        </div>
      `;

    }).join('');

    wrap.innerHTML = `
      <div class="service-grid">
        ${cards}
      </div>
    `;

    const errSec =
      document.getElementById('errors-section');

    if (data.errors && data.errors.length > 0) {

      errSec.innerHTML = `
        <div
          class="section-header"
          style="margin-top:28px"
        >
          <h2>Parse Errors</h2>
        </div>

        <div class="error-list">

          ${data.errors.map(e => `
            <div class="error-item">

              <div class="err-file">
                ${esc(e.file)}
              </div>

              <div>
                ${esc(e.error)}
              </div>

            </div>
          `).join('')}

        </div>
      `;

    } else {

      errSec.innerHTML = '';
    }

    document.getElementById('timestamp').textContent =
      'LAST UPDATED: '
      +
      new Date().toLocaleString('ja-JP');
  }

  function esc(s) {

    return String(s || '').replace(
      /[&<>"']/g,
      c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c])
    );
  }

  loadData();

  setInterval(loadData, 30000);
</script>

</body>
</html>
