services:
  backend:
    build: ./backend
    environment:
      # ホストの / をコンテナの /host にマウントして検索
      SEARCH_ROOT: /host
      PYTHONUNBUFFERED: 1
    volumes:
      - /home/shirahaze/docker:/host:ro          # ホストのルートを読み取り専用でマウント
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket をマウント
      - ./backend:/app                            # ホストの backend をコンテナの /app にマウント（開発用）
    restart: unless-stopped
    networks:
      - dashboard-net

  frontend:
    image: nginx:alpine
    ports:
      - "1010:1010"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
